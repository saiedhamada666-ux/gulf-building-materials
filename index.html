<style>
/* Layout: app shell — sticky brand header, one scrolling view, fixed bottom tab bar. Brand frame (navy run + red tail) echoes the logo's product frames. */
:root{
  --bg:#ffffff; --surface:#f3f5f9; --card:#ffffff; --ink:#0a1a35; --muted:#5a6880; --line:#e2e7ef;
  --navy:#003068; --navy-ink:#ffffff; --navy-soft:#e8eef8; --red:#e1141c; --wa:#1fa855;
  --photo:#ffffff; --shadow:0 1px 2px rgba(0,30,70,.06),0 8px 24px -12px rgba(0,30,70,.18);
  --f-display:"Readex Pro","IBM Plex Sans Arabic",system-ui,sans-serif;
  --f-body:"IBM Plex Sans Arabic","Readex Pro",system-ui,sans-serif;
  --r:14px; --nav-h:68px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#08111f; --surface:#0f1a2c; --card:#111d31; --ink:#edf1f8; --muted:#97a4ba; --line:#1e2b42;
  --navy:#2d63c8; --navy-ink:#ffffff; --navy-soft:#16284a; --red:#ff3d45; --wa:#2fc56a;
  --photo:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#08111f; --surface:#0f1a2c; --card:#111d31; --ink:#edf1f8; --muted:#97a4ba; --line:#1e2b42;
  --navy:#2d63c8; --navy-ink:#ffffff; --navy-soft:#16284a; --red:#ff3d45; --wa:#2fc56a;
  --photo:#ffffff; --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 28px -14px rgba(0,0,0,.6); color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;-webkit-tap-highlight-color:transparent;transition:background-color .35s,color .35s}
button,input{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
:focus-visible{outline:2px solid var(--red);outline-offset:2px;border-radius:8px}
svg{display:block}
.wrap{max-width:1120px;margin-inline:auto;padding-inline:16px}

/* Header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:saturate(1.4) blur(12px);-webkit-backdrop-filter:saturate(1.4) blur(12px)}
.hbar{display:flex;align-items:center;gap:12px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;min-width:0;flex:1;cursor:pointer;background:none;border:0;padding:0;text-align:start}
.logo{width:48px;height:44px;border-radius:12px;background:#fff;display:grid;place-items:center;flex:none;box-shadow:0 0 0 1px var(--line)}
.logo img{width:40px;height:auto}
.brand b{font-family:var(--f-display);font-weight:700;font-size:17px;line-height:1.15;display:block;color:var(--ink)}
.brand small{display:block;color:var(--muted);font-size:12px;letter-spacing:.02em}
.icon-btn{height:40px;min-width:40px;padding-inline:10px;border-radius:12px;border:1px solid var(--line);background:var(--card);display:inline-flex;align-items:center;justify-content:center;gap:6px;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:13px;transition:transform .15s,background-color .2s}
.icon-btn:active{transform:scale(.94)}
.frame-line{height:3px;display:flex}
.frame-line i{flex:3;background:var(--navy)} .frame-line i+i{flex:1;background:var(--red)}
[dir="ltr"] .frame-line{flex-direction:row-reverse}

main{padding-block:16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom,0px))}
.view{display:none}
.view.on{display:block;animation:viewIn .35s cubic-bezier(.2,.7,.2,1) both}
@keyframes viewIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

/* Hero */
.hero{position:relative;overflow:hidden;border-radius:20px;background:var(--navy);color:var(--navy-ink);padding:26px 22px 24px;isolation:isolate}
.hero::before{content:"";position:absolute;inset-block:0;inset-inline-end:-40px;width:46%;background:repeating-linear-gradient(135deg,rgba(255,255,255,.06) 0 14px,transparent 14px 28px);z-index:-1}
.hero::after{content:"";position:absolute;inset-inline-end:0;inset-block-end:0;width:34%;height:6px;background:var(--red)}
.hero .tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;letter-spacing:.04em;background:rgba(255,255,255,.12);padding:4px 10px;border-radius:99px}
.hero h1{font-family:var(--f-display);font-weight:700;font-size:clamp(26px,6vw,40px);line-height:1.2;margin:12px 0 8px;text-wrap:balance}
.hero p{margin:0 0 18px;opacity:.86;max-width:46ch}
.hero .row{display:flex;gap:10px;flex-wrap:wrap}
.hero .btn-white{background:var(--wa);color:#fff}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:46px;padding-inline:18px;border-radius:12px;border:0;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:15px;transition:transform .15s,filter .2s,background-color .2s}
.btn:active{transform:scale(.97)}
.btn-white{background:#fff;color:#003068}
.btn-ghost{background:rgba(255,255,255,.12);color:#fff}
.btn-primary{background:var(--navy);color:var(--navy-ink)}
.btn-primary:hover{filter:brightness(1.1)}
.btn-soft{background:var(--navy-soft);color:var(--ink)}
.btn-block{width:100%}

.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:12px;margin:28px 0 12px}
.sec-h h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;display:flex;align-items:center;gap:10px}
.sec-h h2::before{content:"";width:4px;height:18px;border-radius:2px;background:linear-gradient(var(--navy) 70%,var(--red) 70%)}
.sec-h button{background:none;border:0;color:var(--navy);font-weight:600;cursor:pointer;font-size:14px}
:root[data-theme="dark"] .sec-h button{color:var(--ink)}

/* Category tiles */
.cats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:820px){.cats{grid-template-columns:repeat(4,minmax(0,1fr))}}
.cat{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;cursor:pointer;text-align:start;padding:0;transition:transform .2s,box-shadow .2s}
.cat:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.cat .ph{aspect-ratio:1;background:var(--photo);overflow:hidden;display:block}
.cat .ph img{width:100%;height:100%;object-fit:contain;transition:transform .5s}
.cat:hover .ph img{transform:scale(1.04)}
.cat .meta{padding:10px 12px 12px;display:flex;flex-direction:column;gap:2px}
.cat b{font-family:var(--f-display);font-weight:600;font-size:15px;line-height:1.3}
.cat small{color:var(--muted);font-size:12px;font-variant-numeric:tabular-nums}
.cat .num{position:absolute;inset-block-start:8px;inset-inline-start:8px;background:var(--navy);color:var(--navy-ink);font-family:var(--f-display);font-size:11px;font-weight:600;padding:2px 8px;border-radius:99px}

/* Rail */
.rail{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(160px,200px);gap:12px;overflow-x:auto;padding-bottom:6px;scroll-snap-type:x mandatory;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail>*{scroll-snap-align:start}

/* Product grid */
.toolbar{position:sticky;top:calc(env(safe-area-inset-top,0px) + var(--head-h,67px));z-index:20;background:var(--bg);padding-block:6px 10px;margin-inline:-16px;padding-inline:16px}
.search{display:flex;align-items:center;gap:8px;height:46px;border-radius:12px;background:var(--surface);border:1px solid var(--line);padding-inline:12px}
.search input{flex:1;min-width:0;border:0;background:none;outline:none;height:100%}
.search svg{color:var(--muted);flex:none}
.chips{display:flex;gap:8px;overflow-x:auto;margin-top:10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding-inline:14px;border-radius:99px;border:1px solid var(--line);background:var(--card);cursor:pointer;font-weight:500;font-size:14px;white-space:nowrap;transition:background-color .2s,color .2s,border-color .2s}
.chip[aria-pressed="true"]{background:var(--navy);color:var(--navy-ink);border-color:var(--navy)}
.chip span{opacity:.6;font-size:12px;margin-inline-start:4px;font-variant-numeric:tabular-nums}
.count{color:var(--muted);font-size:13px;margin:4px 0 12px}

.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media(min-width:640px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(min-width:960px){.grid{grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}}
.card{position:relative;display:flex;flex-direction:column;border-radius:var(--r);background:var(--card);border:1px solid var(--line);overflow:hidden;min-width:0;transition:transform .2s,box-shadow .2s}
.card:hover{transform:translateY(-2px);box-shadow:var(--shadow)}
.in{animation:cardIn .45s cubic-bezier(.2,.7,.2,1) both;animation-delay:calc(var(--i,0) * 35ms)}
@keyframes cardIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:none}}
.card .ph{position:relative;aspect-ratio:1;background:var(--photo);cursor:pointer;border:0;padding:0;display:block;width:100%}
.card .ph img{width:100%;height:100%;object-fit:contain}
.card .body{padding:10px 10px 12px;display:flex;flex-direction:column;gap:10px;flex:1}
.card h3{margin:0;font-size:14px;font-weight:600;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em;cursor:pointer}
.card .acts{display:flex;gap:6px;margin-top:auto}
.order{flex:1;min-width:0;height:44px;border-radius:10px;background:var(--navy);color:var(--navy-ink);display:inline-flex;align-items:center;justify-content:center;gap:6px;font-family:var(--f-display);font-weight:600;font-size:14px;transition:filter .2s,transform .15s}
.order:hover{filter:brightness(1.12)}
.order:active{transform:scale(.97)}
.add{position:absolute;z-index:2;inset-block-start:8px;inset-inline-end:8px;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center;cursor:pointer;transition:transform .15s,background-color .2s,color .2s}
.add:active{transform:scale(.9)}
.add.done{background:var(--red);color:#fff;border-color:var(--red)}
.empty{padding:48px 16px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-family:var(--f-display);font-size:18px;margin-bottom:6px}

/* Brands */
.brands{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media(min-width:820px){.brands{grid-template-columns:repeat(6,minmax(0,1fr))}}
.brand-tile{display:flex;flex-direction:column;align-items:center;gap:6px;padding:8px;border-radius:12px;background:var(--card);border:1px solid var(--line);font-size:13px;font-weight:600;transition:transform .2s}
.brand-tile:hover{transform:translateY(-2px)}
.brand-tile span{display:block;width:100%;aspect-ratio:1;border-radius:8px;background:#fff;overflow:hidden}
.brand-tile img{width:100%;height:100%;object-fit:cover;transform:scale(1.25)}

/* Contact */
.contact{margin-top:28px;border-radius:var(--r);border:1px solid var(--line);background:var(--surface);padding:18px;display:flex;flex-wrap:wrap;align-items:center;gap:14px}
.contact .t{flex:1;min-width:200px}
.contact b{font-family:var(--f-display);font-size:16px;display:block}
.phone{font-family:var(--f-display);font-weight:600;font-size:20px;direction:ltr;unicode-bidi:isolate;user-select:all;font-variant-numeric:tabular-nums;letter-spacing:.02em}

/* Cart */
.cart-list{display:flex;flex-direction:column;gap:10px}
.line{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:center;padding:10px;border-radius:var(--r);background:var(--card);border:1px solid var(--line);animation:cardIn .35s both}
.line .th{width:72px;height:72px;border-radius:10px;background:var(--photo);overflow:hidden}
.line .th img{width:100%;height:100%;object-fit:contain}
.line h4{margin:0 0 8px;font-size:14px;font-weight:600;line-height:1.4}
.line .ctl{display:flex;align-items:center;justify-content:space-between;gap:8px}
.stepper{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--surface)}
.stepper button{width:36px;height:36px;border:0;background:none;cursor:pointer;display:grid;place-items:center}
.stepper output{min-width:34px;text-align:center;font-family:var(--f-display);font-weight:600;font-variant-numeric:tabular-nums}
.rm{border:0;background:none;color:var(--muted);cursor:pointer;font-size:13px;display:inline-flex;align-items:center;gap:4px;padding:6px}
.rm:hover{color:var(--red)}
.checkout{margin-top:16px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:16px;display:flex;flex-direction:column;gap:12px}
.fields{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media(max-width:420px){.fields{grid-template-columns:1fr}}
.fields label{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.fields input{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding-inline:12px;outline:none}
.fields input:focus{border-color:var(--navy)}
.sum{display:flex;justify-content:space-between;font-size:14px;color:var(--muted)}
.sum b{color:var(--ink);font-variant-numeric:tabular-nums}
.wa-btn{background:var(--wa);color:#fff}
.wa-btn:hover{filter:brightness(1.06)}

/* Bottom nav */
nav.tabs{position:fixed;inset-inline:0;bottom:0;z-index:40;background:var(--card);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 -8px 24px -18px rgba(0,30,70,.4)}
nav.tabs .in{max-width:560px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav-h);padding-inline:8px}
.tab{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;border:0;background:none;cursor:pointer;color:var(--muted);font-size:12px;font-weight:500;transition:color .2s}
.tab svg{transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.tab[aria-current="page"]{color:var(--navy)}
:root[data-theme="dark"] .tab[aria-current="page"]{color:var(--ink)}
.tab[aria-current="page"] svg{transform:translateY(-2px)}
.tab[aria-current="page"]::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--red)}
.tab.wa{color:var(--wa)}
.badge{position:absolute;top:8px;inset-inline-start:calc(50% + 6px);min-width:18px;height:18px;padding-inline:5px;border-radius:99px;background:var(--red);color:#fff;font-size:11px;font-weight:600;display:grid;place-items:center;font-variant-numeric:tabular-nums}
.badge.pop{animation:pop .4s cubic-bezier(.3,1.8,.5,1)}
@keyframes pop{0%{transform:scale(.4)}100%{transform:scale(1)}}

/* Sheet */
.scrim{position:fixed;inset:0;z-index:50;background:rgba(3,10,24,.5);opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;z-index:60;inset-inline:0;bottom:0;max-height:92%;overflow:auto;background:var(--card);border-radius:22px 22px 0 0;padding:10px 16px calc(18px + env(safe-area-inset-bottom,0px));transform:translateY(105%);transition:transform .38s cubic-bezier(.2,.8,.2,1);max-width:560px;margin-inline:auto}
.sheet.on{transform:none}
@media(min-width:760px){.sheet{bottom:auto;top:50%;border-radius:22px;max-width:760px;transform:translateY(-46%) scale(.97);opacity:0;pointer-events:none;transition:transform .3s,opacity .25s;padding:18px}.sheet.on{transform:translateY(-50%);opacity:1;pointer-events:auto}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
@media(min-width:760px){.grab{display:none}}
.sheet-in{display:grid;gap:16px}
@media(min-width:760px){.sheet-in{grid-template-columns:1fr 1fr;align-items:center}}
.sheet .ph{border-radius:16px;background:var(--photo);aspect-ratio:1;overflow:hidden;max-height:46vh;margin-inline:auto;width:100%}
.sheet .ph img{width:100%;height:100%;object-fit:contain}
.sheet .kicker{font-size:12px;color:var(--muted);letter-spacing:.03em;display:flex;align-items:center;gap:6px}
.sheet .kicker::before{content:"";width:8px;height:8px;border-radius:2px;background:var(--red)}
.sheet h2{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.35;margin:6px 0 14px;text-wrap:balance}
.sheet .qrow{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.sheet .qrow span{font-size:14px;color:var(--muted)}
.sheet .stack{display:flex;flex-direction:column;gap:10px}
.close{position:absolute;inset-block-start:12px;inset-inline-end:12px;width:36px;height:36px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;cursor:pointer;z-index:2}

.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom,0px));z-index:70;transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;font-weight:500;transition:transform .3s,opacity .3s;pointer-events:none;display:flex;align-items:center;gap:8px;max-width:calc(100% - 32px)}
.toast.on{transform:translate(-50%,0);opacity:1}


/* Order buttons in WhatsApp green */
.order{background:var(--wa)!important;color:#fff!important}
#sOrder{background:var(--wa);color:#fff}

/* Promo strip */
.promo{background:var(--red);color:#fff}
.promo .wrap{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;padding-block:7px;font-size:13.5px;font-weight:500;text-align:center}
.promo b{font-family:var(--f-display);font-weight:700}
.clock{display:inline-block;direction:ltr;unicode-bidi:isolate;white-space:nowrap;font-family:var(--f-display);font-weight:700;font-variant-numeric:tabular-nums}
.clock span{display:inline-block;background:rgba(0,0,0,.22);border-radius:6px;padding:1px 6px;min-width:28px;text-align:center}

/* Menu */
.menu-btn{order:9}
.drawer{position:fixed;z-index:65;top:0;bottom:0;inset-inline-end:0;width:min(320px,86vw);background:var(--card);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column;padding:calc(16px + env(safe-area-inset-top,0px)) 16px 16px}
[dir="ltr"] .drawer{transform:translateX(105%)}
.drawer.on{transform:none!important}
.drawer .dh{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.drawer nav{display:flex;flex-direction:column;gap:4px}
.drawer nav button{display:flex;align-items:center;gap:12px;height:52px;padding-inline:12px;border:0;border-radius:12px;background:none;cursor:pointer;font-family:var(--f-display);font-weight:600;font-size:16px;text-align:start;transition:background-color .2s}
.drawer nav button:hover{background:var(--surface)}
.drawer nav button svg{color:var(--red)}
.drawer .foot{margin-top:auto;border-top:1px solid var(--line);padding-top:14px;display:flex;flex-direction:column;gap:10px}
.drawer .frame-line{margin-bottom:16px}

/* Hero v2 */
.hero{display:grid;gap:18px;padding:26px 22px 0}
@media(min-width:820px){.hero{grid-template-columns:1.05fr 1fr;align-items:center;padding:36px 36px 0}}
.hero .copy{padding-bottom:6px}
.stats{display:flex;gap:18px;flex-wrap:wrap;margin-top:20px;padding-top:16px;border-top:1px solid rgba(255,255,255,.16)}
.stats div{display:flex;flex-direction:column}
.stats b{direction:ltr;font-family:var(--f-display);font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.stats span{font-size:12px;opacity:.75}
.collage{position:relative;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;align-items:end;padding-bottom:22px}
.collage figure{margin:0;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 14px 30px -14px rgba(0,0,0,.55);aspect-ratio:1;animation:floatIn .7s cubic-bezier(.2,.7,.2,1) both}
.collage figure img{width:100%;height:100%;object-fit:contain}
.collage figure:nth-child(1){animation-delay:.05s;transform:translateY(-14px)}
.collage figure:nth-child(2){animation-delay:.15s}
.collage figure:nth-child(3){animation-delay:.25s;transform:translateY(-26px)}
.collage figure:nth-child(4){animation-delay:.3s}
.collage figure:nth-child(5){animation-delay:.4s;transform:translateY(-12px)}
.collage figure:nth-child(6){animation-delay:.5s}
@keyframes floatIn{from{opacity:0;translate:0 18px}to{opacity:1;translate:0 0}}

/* About */
.about{display:grid;gap:14px}
@media(min-width:820px){.about{grid-template-columns:1.2fr 1fr;align-items:stretch}}
.about .txt{border-radius:var(--r);border:1px solid var(--line);background:var(--card);padding:20px}
.about .txt p{margin:0 0 12px;max-width:62ch;color:var(--muted)}
.about .txt p:first-child{color:var(--ink);font-size:16px}
.pillars{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.pillar{border-radius:var(--r);background:var(--surface);border:1px solid var(--line);padding:14px;display:flex;flex-direction:column;gap:6px}
.pillar svg{color:var(--navy)}
:root[data-theme="dark"] .pillar svg{color:var(--ink)}
.pillar b{font-family:var(--f-display);font-size:14.5px}
.pillar span{font-size:12.5px;color:var(--muted);line-height:1.5}

/* Reviews */
.rev-grid{display:grid;gap:12px}
@media(min-width:820px){.rev-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
.rev{border-radius:var(--r);border:1px solid var(--line);background:var(--card);padding:16px;display:flex;flex-direction:column;gap:8px}
.stars{display:flex;gap:2px;color:#f5a623}
.rate{border-radius:var(--r);border:1px dashed var(--line);background:var(--surface);padding:18px;display:grid;gap:12px}
@media(min-width:820px){.rate{grid-template-columns:1fr 1.3fr;align-items:center}}
.rate h3{font-family:var(--f-display);margin:0 0 4px;font-size:17px}
.rate p{margin:0;color:var(--muted);font-size:14px}
.pick{display:flex;gap:4px;direction:ltr}
[dir="rtl"] .pick{flex-direction:row-reverse;justify-content:flex-end}
.pick button{border:0;background:none;padding:2px;cursor:pointer;color:var(--line);transition:transform .15s,color .15s}
.pick button.on{color:#f5a623}
.pick button:hover{transform:scale(1.15)}
.rate textarea{width:100%;min-height:76px;border-radius:10px;border:1px solid var(--line);background:var(--card);padding:10px 12px;font:inherit;color:inherit;resize:vertical;outline:none}
.rate textarea:focus{border-color:var(--navy)}
.rate .form{display:flex;flex-direction:column;gap:10px}

/* Footer */
.foot-site{margin-top:32px;border-radius:20px;background:var(--navy);color:var(--navy-ink);padding:24px 20px;display:grid;gap:22px;position:relative;overflow:hidden}
:root[data-theme="dark"] .foot-site{background:#0d1d3a}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .foot-site{background:#0d1d3a}}
@media(min-width:820px){.foot-site{grid-template-columns:1.4fr 1fr 1fr;padding:32px}}
.foot-site::after{content:"";position:absolute;inset-inline-end:0;inset-block-start:0;width:30%;height:5px;background:var(--red)}
.foot-site h4{font-family:var(--f-display);font-size:13px;letter-spacing:.06em;margin:0 0 10px;opacity:.7;font-weight:600}
.foot-site p{margin:0;line-height:1.75;opacity:.92;max-width:52ch}
.foot-brand{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.foot-brand b{font-family:var(--f-display);font-size:18px}
.foot-site .logo{box-shadow:none}
.frow{display:flex;gap:10px;align-items:flex-start;margin-bottom:10px}
.frow svg{flex:none;margin-top:3px;color:#ff6b70}
.foot-site .phone{font-size:17px}
.copyright{grid-column:1/-1;border-top:1px solid rgba(255,255,255,.15);padding-top:14px;font-size:12.5px;opacity:.7}

/* ===== v4: hero slideshow ===== */
.hero2{position:relative;overflow:hidden;border-radius:22px;min-height:440px;display:flex;align-items:flex-end;color:#fff;isolation:isolate;background:#001a3d}
@media(max-width:640px){.hero2{margin-inline:-16px;border-radius:0 0 26px 26px;min-height:560px;margin-top:-16px}}
@media(min-width:900px){.hero2{min-height:500px;align-items:center}}
.slides{position:absolute;inset:0;z-index:-2}
.slides img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:0;transform:scale(1.18);transition:opacity 1.2s ease}
.slides img.on{opacity:1;animation:kb 6.5s linear both}
@keyframes kb{from{transform:scale(1.18)}to{transform:scale(1.32)}}
.hero-shade{position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(0,26,61,.15) 0%,rgba(0,26,61,.55) 40%,rgba(0,26,61,.96) 78%)}
@media(min-width:900px){.hero-shade{background:linear-gradient(to left,rgba(0,26,61,.97) 0%,rgba(0,26,61,.88) 38%,rgba(0,26,61,.25) 75%,rgba(0,26,61,.05) 100%)}
 [dir="ltr"] .hero-shade{background:linear-gradient(to right,rgba(0,26,61,.97) 0%,rgba(0,26,61,.88) 38%,rgba(0,26,61,.25) 75%,rgba(0,26,61,.05) 100%)}}
.hero2::after{content:"";position:absolute;inset-inline-end:0;bottom:0;width:34%;height:5px;background:var(--red)}
.hero-in{position:relative;padding:28px 22px 26px;max-width:560px}
@media(min-width:900px){.hero-in{padding:40px 48px}}
.hero-in .tag{display:inline-flex;font-size:12px;letter-spacing:.04em;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);padding:5px 12px;border-radius:99px}
.hero-in h1{font-family:var(--f-display);font-weight:700;font-size:clamp(30px,7.5vw,48px);line-height:1.15;margin:14px 0 10px;text-wrap:balance;animation:rise .8s .1s both}
.hero-in p{margin:0 0 20px;opacity:.9;font-size:15.5px;max-width:42ch;animation:rise .8s .2s both}
.hero-in .row{display:flex;gap:10px;flex-wrap:wrap;animation:rise .8s .3s both}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
.btn-wa{background:var(--wa);color:#fff;height:50px;padding-inline:22px;font-size:16px}

let y0=null;$('#sheet').addEventListener('touchstart',e=>{if($('#sheet').scrollTop<=0)y0=e.touches[0].clientY},{passive:true});
$('#sheet').addEventListener('touchend',e=>{if(y0!=null&&e.changedTouches[0].clientY-y0>90)closeSheet();y0=null});

function toggleFav(id){const i=favs.indexOf(id);if(i>-1)favs.splice(i,1);else favs.push(id);store.set('favs',favs);const on=favs.includes(id);
  $$(`[data-fav="${id}"]`).forEach(b=>{b.classList.toggle('on',on);b.setAttribute('aria-pressed',on);b.innerHTML=ICON_HEART(on)});
  if(cur&&cur.id===id){$('#sFav').innerHTML=ICON_HEART(on);$('#sFav').classList.toggle('on',on)}
  toast(on?t('favAdd'):t('favRm'));if(view==='products'){renderChips();if(cat==='favs')renderGrid()}}
$('#sFav').onclick=()=>cur&&toggleFav(cur.id);
$('#sShare').onclick=()=>{if(!cur)return;const u=location.origin+location.pathname+'#p'+cur.id;const txt=nm(cur)+' – '+t('brand')+'\n'+u;
  if(navigator.share){navigator.share({title:nm(cur),text:nm(cur),url:u}).catch(()=>{});return}
  try{navigator.clipboard.writeText(txt).then(()=>toast(t('linkCopied')),()=>{})}catch(e){}};
$('#toTop').onclick=()=>window.scrollTo({top:0,behavior:'smooth'});
addEventListener('scroll',()=>{$('#toTop').classList.toggle('on',scrollY>900);
  if(view==='home'){let curS=null;CATS.forEach(c=>{const el=document.getElementById('sec-'+c.id);if(el&&el.getBoundingClientRect().top<200)curS=c.id});$$('#jump button').forEach(b=>b.classList.toggle('on',b.dataset.jump===curS))}},{passive:true});
function scrollToId(id){requestAnimationFrame(()=>{const el=document.getElementById(id);if(!el)return;const y=el.getBoundingClientRect().top+scrollY-$('header').offsetHeight-8;window.scrollTo({top:y,behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'})})}
function openMenu(){$('#drawer').classList.add('on');$('#mScrim').classList.add('on');$('#menuBtn').setAttribute('aria-expanded','true')}
function closeMenu(){$('#drawer').classList.remove('on');$('#mScrim').classList.remove('on');$('#menuBtn').setAttribute('aria-expanded','false')}
$('#menuBtn').onclick=openMenu;$('#mClose').onclick=closeMenu;$('#mScrim').onclick=closeMenu;
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeMenu()});
const pad=n=>String(n).padStart(2,'0');
function tick(){const l=offerLeft(),p=$('#promo');if(l<=0){if(!p.hidden){p.hidden=true;setHead();renderAll()}return}
  p.hidden=false;const s=Math.floor(l/1000);const c=$('#clock').children;c[0].textContent=pad(Math.floor(s/3600));c[1].textContent=pad(Math.floor(s%3600/60));c[2].textContent=pad(s%60)}
function setHead(){document.documentElement.style.setProperty('--head-h',$('header').offsetHeight+'px')}
tick();setInterval(tick,1000);
applyTheme();applyLang();setHead();startSlides();
const hm=location.hash.match(/^#p(\d+)$/);if(hm)setTimeout(()=>openSheet(+hm[1]),300);addEventListener('resize',setHead);
})();
</script>
